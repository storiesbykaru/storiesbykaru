.section{padding:var(--section-pad,105px) 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:40px}.section-title{font:400 48px var(--display-font),serif;color:var(--heading-color);margin:0}.section-note{font:11px var(--body-font),sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--label-color)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap,16px)}.grid figure{margin:0;overflow:hidden}.grid figure:nth-child(2),.grid figure:nth-child(5),.grid figure:nth-child(8){margin-top:48px}.grid img{width:100%;display:block}.story{display:grid;grid-template-columns:48% 52%;align-items:center}.story-photo{padding-right:48px}.story-photo img{width:100%;display:block}.story-copy{padding:var(--story-copy-pad,40px) 6vw}.story-copy h2{font:400 62px/.9 var(--display-font),serif;color:var(--heading-color);margin:0 0 34px}.story-copy p{font-family:var(--body-font),sans-serif;font-size:var(--body-size);line-height:1.9;color:var(--muted);max-width:500px}.gallery-list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.gallery-card{display:block;text-decoration:none;color:inherit}.gallery-card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.gallery-card h3{font:400 29px var(--display-font),serif;color:var(--heading-color);margin:13px 0 3px}.gallery-card p{font:11px var(--body-font),sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--label-color);margin:0}

/* V13 — editorial / magazine gallery */
.gallery-list{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:clamp(28px,4vw,62px) clamp(18px,2.4vw,38px);
  align-items:start;
}
.gallery-card{
  grid-column:span 5;
  display:block;
  color:inherit;
  text-decoration:none;
  transform:translateY(0);
  transition:transform .55s cubic-bezier(.2,.7,.2,1);
}
.gallery-card:nth-child(3n+2){grid-column:7 / span 6;margin-top:clamp(40px,7vw,110px)}
.gallery-card:nth-child(3n+3){grid-column:2 / span 5;margin-top:clamp(10px,3vw,45px)}
.gallery-card:nth-child(3n+1){grid-column:1 / span 5}
.gallery-card img{
  width:100%;
  height:auto;
  display:block;
  object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .8s ease;
  will-change:transform;
}
.gallery-card:hover{transform:translateY(-7px)}
.gallery-card:hover img{transform:scale(1.018)}
.gallery-card h3{
  margin:15px 0 5px;
  font:400 clamp(25px,3vw,42px) var(--display-font),serif;
  color:var(--heading-color);
}
.gallery-card p{
  margin:0;
  font:400 11px var(--body-font),sans-serif;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--label-color);
}
.gallery-card{opacity:0;animation:karuGalleryIn .8s ease forwards}
.gallery-card:nth-child(2){animation-delay:.08s}
.gallery-card:nth-child(3){animation-delay:.16s}
.gallery-card:nth-child(4){animation-delay:.24s}
.gallery-card:nth-child(5){animation-delay:.32s}
.gallery-card:nth-child(6){animation-delay:.40s}
@keyframes karuGalleryIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}


\n/* V14 — full gallery editorial viewer */\n.viewer-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px 18px;padding:0 22px 60px;align-items:start}.viewer-grid img{width:100%;height:auto;display:block;grid-column:span 4}.viewer-grid img:nth-child(3n+2){grid-column:5 / span 5;margin-top:38px}.viewer-grid img:nth-child(3n+3){grid-column:9 / span 4;margin-top:82px}.viewer-grid img:nth-child(5n+1){grid-column:1 / span 5}.viewer-grid img:nth-child(5n+2){grid-column:7 / span 6}.viewer-grid img:nth-child(5n+3){grid-column:2 / span 5}.viewer-grid img:nth-child(5n+4){grid-column:8 / span 5}.viewer-grid img:nth-child(5n+5){grid-column:4 / span 6}\n\n</style>

.karu-reveal.karu-visible{opacity:1;transform:none}
</style>
<style>

  .hero-copy>*:nth-child(3){animation-delay:.35s}

  .hero-image{opacity:0;animation:karuImage 1.1s .2s cubic-bezier(.22,.61,.36,1) forwards}

  .section:not(#story){opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.61,.36,1)}
  .section.karu-visible:not(#story){opacity:1;transform:none}

  #story{
    display:grid!important;
    grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr)!important;
    gap:clamp(28px,5vw,72px)!important;
    align-items:center!important;
    opacity:1!important;
    visibility:visible!important;
    transform:none!important;
  }
  #story .story-photo,#story .story-copy{
    opacity:0;
    visibility:visible;
    transform:none;
  }
  #story.karu-visible .story-photo{animation:karuStoryPhoto .9s .05s cubic-bezier(.22,.61,.36,1) forwards}
  #story.karu-visible .story-copy{animation:karuStoryCopy .9s .16s cubic-bezier(.22,.61,.36,1) forwards}

  .grid figure,.gallery-card{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.22,.61,.36,1)}
  .karu-visible .grid figure,.karu-visible .gallery-card{opacity:1;transform:none}

  @keyframes karuHeaderIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
  @keyframes karuUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes karuImage{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}

}
@media (prefers-reduced-motion:reduce){
  #story,#story .story-photo,#story .story-copy{opacity:1!important;visibility:visible!important;transform:none!important}
}

<script src="data.js"></script><script>
(function(){

  const img=x=>x&&x.startsWith('data:')?x:(x?'images/'+x:'');
  const root=document.documentElement;
  root.style.setProperty('--bg',c.theme.background||'#4a111c'); root.style.setProperty('--gold',c.theme.accent||'#cda45d'); root.style.setProperty('--cream',c.theme.text||'#eee4d5'); root.style.setProperty('--muted',c.theme.muted||'#d8cfc4');
  root.style.setProperty('--header-text-color',c.brand.headerTextColor||c.theme.accent||'#cda45d'); root.style.setProperty('--hero-text-color',c.brand.heroTextColor||c.theme.text||'#eee4d5');
  root.style.setProperty('--header-h',(c.layout.headerHeight||82)+'px'); root.style.setProperty('--header-pad',(c.layout.headerPad||0)+'px'); root.style.setProperty('--logo-w',(c.layout.logoWidth||190)+'px'); root.style.setProperty('--hero-logo-w',(c.layout.heroLogoWidth||300)+'px'); root.style.setProperty('--nav-gap',(c.layout.navGap||34)+'px'); root.style.setProperty('--nav-letter',((c.layout.navLetter??18)/100)+'em'); root.style.setProperty('--hero-img-h',(c.layout.heroImageHeight||650)+'px'); root.style.setProperty('--hero-copy-pad',(c.layout.heroCopyPad||54)+'px'); root.style.setProperty('--grid-gap',(c.layout.gridGap||16)+'px'); root.style.setProperty('--section-pad',(c.layout.sectionPad||105)+'px'); root.style.setProperty('--story-copy-pad',(c.layout.storyCopyPad||40)+'px'); root.style.setProperty('--contact-pad',(c.layout.contactPad||120)+'px');
  root.style.setProperty('--body-font',c.typography.bodyFont||'DM Sans'); root.style.setProperty('--display-font',c.typography.displayFont||'Cormorant Garamond'); root.style.setProperty('--body-size',(c.typography.bodySize||14)+'px'); root.style.setProperty('--body-line',c.typography.bodyLine||1.75); root.style.setProperty('--body-letter',(c.typography.bodyLetter||0)+'px'); root.style.setProperty('--heading-color',c.typography.headingColor||c.theme.text||'#eee4d5'); root.style.setProperty('--label-color',c.typography.labelColor||c.theme.accent||'#cda45d');
  root.style.setProperty('--header-font',c.layout.headerFont==='body'?c.typography.bodyFont:(c.layout.headerFont||'var(--display-font)')); root.style.setProperty('--hero-font',c.layout.heroFont==='body'?c.typography.bodyFont:(c.layout.heroFont||'var(--display-font)')); root.style.setProperty('--header-text-size',(c.layout.headerTextSize||22)+'px'); root.style.setProperty('--header-letter',((c.layout.headerTextLetter??14)/100)+'em');
  const hu=c.layout.headerUnderline||'none'; root.style.setProperty('--header-underline',hu==='always'?'underline':'none'); root.style.setProperty('--header-hover-underline',hu==='hover'?'underline':'none');
  root.style.setProperty('--hero-text-size',(c.layout.heroTextSize||100)+'px'); root.style.setProperty('--hero-text-line',c.layout.heroTextLine||.77); root.style.setProperty('--hero-text-letter',((c.layout.heroTextLetter??-2.5)/100)+'em');
  if(c.typography.customBodyFont){const s=document.createElement('style');s.textContent=`@font-face{font-family:'KaruCustomBody';src:url("${c.typography.customBodyFont}") format('woff2');font-weight:100 900;font-style:normal}`;document.head.appendChild(s);root.style.setProperty('--body-font','KaruCustomBody');}
  if(c.typography.customDisplayFont){const s=document.createElement('style');s.textContent=`@font-face{font-family:'KaruCustomDisplay';src:url("${c.typography.customDisplayFont}") format('woff2');font-weight:100 900;font-style:normal}`;document.head.appendChild(s);root.style.setProperty('--display-font','KaruCustomDisplay');}
  const bgMode=c.theme.backgroundMode||'texture';
  const bg=img(c.theme.backgroundImage||'');
  root.style.setProperty('--bg',c.theme.background||'#4a111c');
  root.style.setProperty('--bg-image',bgMode==='solid'?'none':(bg?`url("${bg}")`:'none'));
  root.style.setProperty('--bg-opacity',bgMode==='solid'?'0':((Number(c.theme.backgroundOpacity??16))/100));
  root.style.setProperty('--bg-size',c.theme.backgroundSize||'cover');
  root.style.setProperty('--bg-position',c.theme.backgroundPosition||'center top');
  root.style.setProperty('--bg-repeat',c.theme.backgroundRepeat||'repeat');
  const headerBrand=document.getElementById('headerBrand'); const headerMode=c.brand.headerMode||'text';
  if(headerMode==='logo'){const im=document.createElement('img');im.className='logo-img';im.alt=c.brand.name||'Stories by Karu';im.src=img(c.brand.headerLogo||c.brand.logo);headerBrand.appendChild(im);}else{const span=document.createElement('span');span.className='header-text';span.textContent=c.brand.headerText||c.brand.name||'KARU';headerBrand.appendChild(span);}
  document.getElementById('nav').innerHTML=(c.navigation||[]).map(x=>`<a href="#${String(x).toLowerCase().replace(/[^a-z0-9]+/g,'-')}">${x}</a>`).join('');
  document.getElementById('heroEyebrow').textContent=c.hero?.eyebrow||''; const hb=document.getElementById('heroBrand'); if((c.brand.heroMode||'text')==='logo'){const im=document.createElement('img');im.className='hero-brand-logo';im.alt=c.brand.heroText||'Stories by Karu';im.src=img(c.brand.heroLogo||c.brand.logo);hb.appendChild(im);}else{const h=document.createElement('h1');h.className='hero-brand-text';h.innerHTML=(c.brand.heroText||c.hero?.title||'Stories by Karu').replace(/ /,'<br>');hb.appendChild(h);} document.getElementById('tagline').textContent=c.brand.tagline||''; document.getElementById('heroText').textContent=c.hero?.text||''; document.getElementById('heroImage').src=img(c.hero?.image);
  document.getElementById('workTitle').textContent=c.work?.title||''; document.getElementById('workNote').textContent=c.work?.note||''; document.getElementById('workGrid').innerHTML=(c.work?.images||[]).map(x=>`<figure><img src="${img(x)}"></figure>`).join('');
  document.getElementById('storyEyebrow').textContent=c.story?.eyebrow||''; document.getElementById('storyTitle').textContent=c.story?.title||''; document.getElementById('storyText').textContent=c.story?.text||''; document.getElementById('storyImage').src=img(c.story?.image);
  document.getElementById('contactEyebrow').textContent=c.contact?.eyebrow||''; document.getElementById('contactTitle').textContent=c.contact?.title||''; document.getElementById('contactDescription').textContent=c.contact?.description||''; const links=c.contact.links||[{label:'Instagram',url:c.contact.instagram||''},{label:'WhatsApp',url:c.contact.whatsapp||''},{label:'Email',url:c.contact.email?'mailto:'+c.contact.email:''}]; document.getElementById('contactLinks').innerHTML=links.filter(x=>x&&x.label).map(x=>`<a href="${x.url||'#'}" ${x.url&&/^https?:/.test(x.url)?'target="_blank"':''}>${x.label}</a>`).join('');
  function renderGalleries(){const gl=document.getElementById('galleryList'); gl.innerHTML=(c.galleries||[]).map((g,i)=>`<a class="gallery-card" href="#" data-i="${i}"><img src="${img(g.cover||(g.images||[])[0])}"><h3>${g.name||''}</h3><p>${g.subtitle||''}</p></a>`).join(''); document.querySelectorAll('.gallery-card').forEach(a=>a.onclick=e=>{e.preventDefault();const g=c.galleries[+a.dataset.i];document.getElementById('viewerTitle').textContent=g.name||'';document.getElementById('viewerGrid').innerHTML=(g.images||[]).map(x=>`<img src="${img(x)}">`).join('');document.getElementById('viewer').classList.add('open')});}
  document.getElementById('viewerClose').onclick=()=>document.getElementById('viewer').classList.remove('open');
  async function loadGalleryDB(){try{const r=indexedDB.open('karuGalleryDB_v2',1);const db=await new Promise((res,rej)=>{r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('store'))r.result.createObjectStore('store')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const g=await new Promise((res,rej)=>{const t=db.transaction('store','readonly');const q=t.objectStore('store').get('galleries');q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)});db.close();if(Array.isArray(g))c.galleries=g;}catch(e){console.warn('Gallery storage unavailable',e)} renderGalleries();}
  loadGalleryDB();
})();
</script>
<script>
(function(){
  try{
    if(!('IntersectionObserver' in window)) return;
    var items=document.querySelectorAll('.section,.hero,.contact,.story');
    items.forEach(function(el){el.classList.add('karu-reveal')});
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){e.target.classList.add('karu-visible');io.unobserve(e.target);}
      });
    },{threshold:.08});
    items.forEach(function(el){io.observe(el)});
  }catch(e){}
})();
</script>

<script>
(function(){
  if(window.__karuV15Anim) return;
  window.__karuV15Anim=true;
  try{
    var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) return;
    if(!('IntersectionObserver' in window)) return;
    var sections=document.querySelectorAll('.section');
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('karu-visible');
          io.unobserve(e.target);
        }
      });
    },{threshold:.08,rootMargin:'0px 0px -5% 0px'});
    sections.forEach(function(s){io.observe(s)});
  }catch(e){}
})();
</script>
